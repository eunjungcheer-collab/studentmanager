<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>학원 알림장 (구글 시트 연동)</title>
    <style>
        :root {
            --primary-color: #4a90e2;
            --bg-color: #f4f7f6;
            --card-bg: #ffffff;
            --text-color: #333333;
            --border-color: #dddddd;
        }

        * { box-sizing: border-box; font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; margin: 0; padding: 0; }
        body { background-color: var(--bg-color); color: var(--text-color); padding: 20px; max-width: 800px; margin: 0 auto; }
        h1 { text-align: center; margin-bottom: 20px; color: var(--primary-color); font-size: 1.8rem; }
        .container { display: grid; grid-template-columns: 1fr; gap: 20px; }
        @media (min-width: 768px) { .container { grid-template-columns: 1fr 1fr; } }
        .card { background-color: var(--card-bg); padding: 20px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
        .form-group { margin-bottom: 15px; }
        label { display: block; font-weight: bold; margin-bottom: 5px; font-size: 0.9rem; }
        input, select, textarea { width: 100%; padding: 10px; border: 1px solid var(--border-color); border-radius: 6px; font-size: 0.95rem; }
        input:focus, select:focus, textarea:focus { outline: none; border-color: var(--primary-color); }
        .student-info { background-color: #eef5fc; padding: 10px; border-radius: 6px; font-size: 0.85rem; margin-top: 5px; display: none; line-height: 1.4; }
        textarea#result { height: 250px; resize: vertical; background-color: #fafafa; line-height: 1.5; }
        .btn-group { display: flex; gap: 10px; margin-top: 10px; }
        button { flex: 1; padding: 12px; border: none; border-radius: 6px; font-weight: bold; font-size: 0.95rem; cursor: pointer; transition: background 0.2s; }
        .btn-primary { background-color: var(--primary-color); color: white; }
        .btn-primary:hover { background-color: #357abd; }
        .btn-share { background-color: #fee500; color: #000; }
        .btn-share:hover { background-color: #e6ce00; }
        .btn-refresh { background-color: #2ecc71; color: white; width: 100%; margin-bottom: 15px; }
        .btn-refresh:hover { background-color: #27ae60; }
        .loading { text-align: center; color: #666; font-size: 0.9rem; margin-bottom: 10px; font-weight: bold; }
        .toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: rgba(0,0,0,0.8); color: white; padding: 10px 20px; border-radius: 20px; font-size: 0.9rem; display: none; z-index: 1000; }
    </style>
</head>
<body>

    <h1>📝 학원 알림장 (구글 시트 연동)</h1>
    <button class="btn-refresh" onclick="fetchSheetData()">🔄 구글 시트 데이터 새로고침</button>
    <div id="loadingText" class="loading">구글 시트에서 데이터를 불러오는 중...</div>

    <div class="container">
        <!-- 입력 영역 -->
        <div class="card">
            <div class="form-group">
                <label for="studentSelect">학생 선택</label>
                <select id="studentSelect" onchange="updateStudentInfo()">
                    <option value="">-- 학생을 선택하세요 --</option>
                </select>
                <div id="studentInfoBox" class="student-info"></div>
            </div>

            <div class="form-group">
                <label for="bookSelect">교재 선택</label>
                <select id="bookSelect" onchange="updateLessonOptions()">
                    <option value="">-- 교재를 선택하세요 --</option>
                </select>
            </div>

            <div class="form-group">
                <label for="lessonSelect">오늘 진도 선택</label>
                <select id="lessonSelect" onchange="generateNotice()">
                    <option value="">-- 진도를 선택하세요 --</option>
                </select>
            </div>

            <div class="form-group">
                <label for="scoreInput">오늘 시험 점수</label>
                <input type="text" id="scoreInput" placeholder="예: 95점 / 단원평가" oninput="generateNotice()">
            </div>

            <div class="form-group">
                <label for="absentDate">결석 날짜 (선택)</label>
                <input type="date" id="absentDate" onchange="generateNotice()">
            </div>

            <div class="form-group">
                <label for="makeupDate">보강 일정 (선택)</label>
                <input type="text" id="makeupDate" placeholder="예: 9/12(목) 5시 보강" oninput="generateNotice()">
            </div>

            <div class="form-group">
                <label for="memoInput">특이사항 메모 (선택)</label>
                <input type="text" id="memoInput" placeholder="예: 오늘 수업 집중도가 매우 좋았습니다." oninput="generateNotice()">
            </div>
        </div>

        <!-- 결과 영역 -->
        <div class="card">
            <div class="form-group">
                <label for="result">생성된 알림장 내용</label>
                <textarea id="result" readonly placeholder="좌측 항목을 선택하면 알림장이 자동 생성됩니다."></textarea>
            </div>

            <div class="btn-group">
                <button class="btn-primary" onclick="copyNotice()">📋 문구 복사 (아카2000용)</button>
                <button class="btn-share" onclick="shareNotice()">📲 카톡 공유</button>
            </div>
        </div>
    </div>

    <div id="toast" class="toast">안내 메시지</div>

    <script>
        // 🔗 발급받으신 구글 앱스 스크립트 웹 앱 URL 적용 완료
        const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbypEPpo_ah7GwsKXHm7K8gnrWkhHtJcSyafLysb2_-5B5Wq9tf1rdc8NQXmG22YvOUg/exec";

        let students = [];
        let curriculum = {};

        window.onload = function() {
            fetchSheetData();
        };

        // 구글 시트에서 최신 데이터 불러오기
        function fetchSheetData() {
            const loading = document.getElementById("loadingText");
            loading.style.display = "block";
            loading.textContent = "구글 시트에서 최신 데이터를 불러오는 중...";

            fetch(GOOGLE_SCRIPT_URL)
                .then(response => response.json())
                .then(data => {
                    students = data.students || [];
                    curriculum = data.curriculum || {};

                    refreshStudentSelect();
                    refreshBookSelect();

                    loading.textContent = "✅ 최신 데이터 로드 완료!";
                    setTimeout(() => { loading.style.display = "none"; }, 2000);
                })
                .catch(err => {
                    console.error(err);
                    loading.textContent = "❌ 데이터 불러오기 실패. 구글 시트 배포 설정을 확인해 주세요.";
                });
        }

        function refreshStudentSelect() {
            const select = document.getElementById("studentSelect");
            select.innerHTML = '<option value="">-- 학생을 선택하세요 --</option>';
            students.forEach(s => {
                const opt = document.createElement("option");
                opt.value = s.id;
                opt.textContent = `${s.name} (${s.school})`;
                select.appendChild(opt);
            });
        }

        function refreshBookSelect() {
            const select = document.getElementById("bookSelect");
            select.innerHTML = '<option value="">-- 교재를 선택하세요 --</option>';
            Object.keys(curriculum).forEach(book => {
                const opt = document.createElement("option");
                opt.value = book;
                opt.textContent = book;
                select.appendChild(opt);
            });
        }

        function updateStudentInfo() {
            const studentId = document.getElementById("studentSelect").value;
            const infoBox = document.getElementById("studentInfoBox");

            if (!studentId) {
                infoBox.style.display = "none";
                generateNotice();
                return;
            }

            const s = students.find(item => item.id === studentId);
            infoBox.innerHTML = `
                📌 <b>학교/학년:</b> ${s.school}<br>
                📚 <b>교과서:</b> ${s.book} | <b>시험범위:</b> ${s.range}
            `;
            infoBox.style.display = "block";
            generateNotice();
        }

        function updateLessonOptions() {
            const bookName = document.getElementById("bookSelect").value;
            const lessonSelect = document.getElementById("lessonSelect");
            lessonSelect.innerHTML = '<option value="">-- 진도를 선택하세요 --</option>';

            if (bookName && curriculum[bookName]) {
                curriculum[bookName].forEach((item, index) => {
                    const opt = document.createElement("option");
                    opt.value = index;
                    opt.textContent = item.lesson;
                    lessonSelect.appendChild(opt);
                });
            }
            generateNotice();
        }

        function generateNotice() {
            const studentId = document.getElementById("studentSelect").value;
            const bookName = document.getElementById("bookSelect").value;
            const lessonIdx = document.getElementById("lessonSelect").value;
            const score = document.getElementById("scoreInput").value;
            const absentDate = document.getElementById("absentDate").value;
            const makeupDate = document.getElementById("makeupDate").value;
            const memo = document.getElementById("memoInput").value;

            if (!studentId || !bookName || lessonIdx === "") {
                document.getElementById("result").value = "";
                return;
            }

            const student = students.find(s => s.id === studentId);
            const lessonObj = curriculum[bookName][lessonIdx];

            let text = `[OO학원 알림장]\n`;
            text += `👤 학생명: ${student.name} (${student.school})\n`;
            text += `📖 오늘 진도: ${bookName} [${lessonObj.lesson}]\n`;
            text += `✏️ 오늘 과제: ${lessonObj.homework}\n`;

            if (score) text += `📊 시험 점수: ${score}\n`;

            text += `\n[학습 및 시험 안내]\n`;
            text += `* 교과서/시험범위: ${student.book} / ${student.range}\n`;

            if (absentDate || makeupDate) {
                text += `\n[출결 및 보강 안내]\n`;
                if (absentDate) text += `* 결석일: ${absentDate}\n`;
                if (makeupDate) text += `* 보강 일정: ${makeupDate}\n`;
            }

            if (memo) text += `\n💬 강사 메모: ${memo}\n`;

            text += `\n다음 수업 전까지 과제를 완료할 수 있도록 지도 부탁드립니다. 감사합니다!`;

            document.getElementById("result").value = text;
        }

        function copyNotice() {
            const resultText = document.getElementById("result");
            if (!resultText.value) return alert("생성된 알림장 내용이 없습니다.");
            navigator.clipboard.writeText(resultText.value).then(() => showToast("클립보드에 복사되었습니다! 아카2000에 붙여넣으세요."));
        }

        function shareNotice() {
            const resultText = document.getElementById("result").value;
            if (!resultText) return alert("생성된 알림장 내용이 없습니다.");
            if (navigator.share) {
                navigator.share({ title: '학원 알림장', text: resultText });
            } else {
                copyNotice();
                alert("모바일 환경에서 실행하시거나, [문구 복사] 후 카카오톡에 붙여넣어 주세요.");
            }
        }

        function showToast(msg) {
            const toast = document.getElementById("toast");
            toast.textContent = msg;
            toast.style.display = "block";
            setTimeout(() => { toast.style.display = "none"; }, 2000);
        }
    </script>
</body>
</html>
