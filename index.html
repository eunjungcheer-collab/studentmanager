<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>학생관리 알림장</title>
    <style>
        :root {
            --primary-color: #4a90e2;
            --bg-color: #f4f7f6;
            --card-bg: #ffffff;
            --text-color: #333333;
            --border-color: #dddddd;
        }

        * { box-sizing: border-box; font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; margin: 0; padding: 0; }
        body { background-color: var(--bg-color); color: var(--text-color); padding: 15px; max-width: 850px; margin: 0 auto; }
        h1 { text-align: center; margin-bottom: 15px; color: var(--primary-color); font-size: 1.6rem; line-height: 1.3; }
        
        .container { display: grid; grid-template-columns: 1fr; gap: 15px; }
        @media (min-width: 768px) { .container { grid-template-columns: 1fr 1fr; } body { padding: 20px; } }
        .card { background-color: var(--card-bg); padding: 15px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
        .form-group { margin-bottom: 12px; position: relative; }
        
        .label-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 4px; }
        label { font-weight: bold; font-size: 0.85rem; }
        
        input, select, textarea { width: 100%; padding: 10px; border: 1px solid var(--border-color); border-radius: 6px; font-size: 0.95rem; }
        input[type="date"] { cursor: pointer; background-color: #fff; }
        input:focus, select:focus, textarea:focus { outline: none; border-color: var(--primary-color); }
        
        /* 학생 자동완성 검색 드롭다운 스타일 */
        .autocomplete-results {
            position: absolute;
            top: 100%;
            left: 0;
            right: 0;
            background: #ffffff;
            border: 1px solid var(--primary-color);
            border-top: none;
            border-radius: 0 0 8px 8px;
            max-height: 200px;
            overflow-y: auto;
            z-index: 1000;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            display: none;
        }
        .autocomplete-item {
            padding: 10px 12px;
            cursor: pointer;
            font-size: 0.9rem;
            border-bottom: 1px solid #f0f0f0;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .autocomplete-item:last-child { border-bottom: none; }
        .autocomplete-item:hover, .autocomplete-item.active { background-color: #eef5fc; color: var(--primary-color); font-weight: bold; }
        .autocomplete-item .school-tag { font-size: 0.8rem; color: #777; font-weight: normal; }

        .student-info { background-color: #eef5fc; padding: 8px 10px; border-radius: 6px; font-size: 0.85rem; margin-top: 5px; display: none; line-height: 1.4; border-left: 3px solid var(--primary-color); }
        
        .card-header-flex { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
        .card-title { font-size: 1rem; font-weight: bold; color: #2c3e50; }

        .copy-box-group { margin-bottom: 10px; }
        .copy-box-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 3px; }
        .copy-box-header label { font-size: 0.85rem; color: #555; }
        .btn-sm { padding: 3px 8px; font-size: 0.75rem; background-color: #e2e8f0; border: 1px solid #cbd5e1; border-radius: 4px; cursor: pointer; font-weight: bold; }
        .btn-sm:hover { background-color: #cbd5e1; }
        .btn-reset { background-color: #e74c3c; color: white; border: none; padding: 6px 10px; border-radius: 4px; font-weight: bold; font-size: 0.8rem; cursor: pointer; }
        .btn-reset:hover { background-color: #c0392b; }
        textarea#result { height: 160px; resize: vertical; background-color: #fafafa; line-height: 1.5; font-size: 0.9rem; font-weight: 500; }

        .btn-group { display: flex; flex-direction: column; gap: 8px; margin-top: 12px; }
        @media (min-width: 480px) { .btn-group { flex-direction: row; flex-wrap: wrap; } }
        button.btn-main { flex: 1 1 45%; padding: 12px; border: none; border-radius: 6px; font-weight: bold; font-size: 0.85rem; cursor: pointer; transition: background 0.2s; }
        .btn-primary { background-color: var(--primary-color); color: white; }
        .btn-share { background-color: #fee500; color: #000; }
        .btn-save-sheet { background-color: #27ae60; color: white; width: 100%; margin-top: 5px; font-size: 0.95rem; }
        .btn-save-sheet:hover { background-color: #219653; }
        .btn-refresh { background-color: #2ecc71; color: white; width: 100%; margin-bottom: 12px; }
        
        .loading { text-align: center; color: #666; font-size: 0.85rem; margin-bottom: 10px; font-weight: bold; }
        .toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: rgba(0,0,0,0.85); color: white; padding: 10px 20px; border-radius: 20px; font-size: 0.85rem; display: none; z-index: 1000; }
        .date-time-flex { display: flex; gap: 6px; }
        .date-time-flex input[type="date"] { flex: 1.2; }
        .date-time-flex input[type="text"] { flex: 1; }
    </style>
</head>
<body>

    <h1>📝 학생관리 알림장</h1>
    <button class="btn-refresh btn-main" onclick="fetchSheetData()">🔄 구글 시트 데이터 새로고침</button>
    <div id="loadingText" class="loading">구글 시트에서 데이터를 불러오는 중...</div>

    <div class="container">
        <!-- 입력 영역 -->
        <div class="card">
            <div class="card-header-flex">
                <span class="card-title">학생 및 수업 내용 입력</span>
                <button class="btn-reset" onclick="resetForm()">✨ 새로 입력</button>
            </div>

            <!-- 1. 학생 검색 및 선택 (자동완성 기능 적용) -->
            <div class="form-group">
                <div class="label-header">
                    <label for="studentInput">학생 이름 검색/선택</label>
                    <button class="btn-sm" onclick="copySelectedStudentName()">📋 이름 복사</button>
                </div>
                <input type="text" id="studentInput" placeholder="🔍 학생 이름을 입력하세요..." oninput="onStudentSearchInput()" onfocus="onStudentSearchInput()" onkeydown="handleStudentKeyDown(event)" autocomplete="off">
                <div id="studentResults" class="autocomplete-results"></div>
                <input type="hidden" id="selectedStudentId">
                <div id="studentInfoBox" class="student-info"></div>
            </div>

            <!-- 2. 교재 선택 -->
            <div class="form-group">
                <div class="label-header">
                    <label for="bookSelect">교재 선택</label>
                    <button class="btn-sm" onclick="copySelectText('bookSelect', '교재명')">📋 복사</button>
                </div>
                <select id="bookSelect" onchange="updateLessonOptions(); saveCurrentInput();">
                    <option value="">-- 교재를 선택하세요 --</option>
                </select>
            </div>

            <!-- 3. 오늘 진도 선택 -->
            <div class="form-group">
                <div class="label-header">
                    <label for="lessonSelect">오늘 진도 선택</label>
                    <button class="btn-sm" onclick="copySelectText('lessonSelect', '오늘 진도')">📋 복사</button>
                </div>
                <select id="lessonSelect" onchange="onLessonChange(); saveCurrentInput();">
                    <option value="">-- 진도를 선택하세요 --</option>
                </select>
            </div>

            <!-- 4. 오늘 시험 점수 -->
            <div class="form-group">
                <div class="label-header">
                    <label for="scoreInput">오늘 시험 점수 (선택)</label>
                    <button class="btn-sm" onclick="copyInputValue('scoreInput', '시험 점수')">📋 복사</button>
                </div>
                <input type="text" id="scoreInput" placeholder="예: 95점 / 단원평가" oninput="saveCurrentInput();">
            </div>

            <!-- 5. 결석 날짜 -->
            <div class="form-group">
                <div class="label-header">
                    <label for="absentDate">결석 날짜 (선택)</label>
                    <button class="btn-sm" onclick="copyInputValue('absentDate', '결석 날짜')">📋 복사</button>
                </div>
                <input type="date" id="absentDate" onchange="saveCurrentInput();">
            </div>

            <!-- 6. 보강 날짜 및 시간 -->
            <div class="form-group">
                <div class="label-header">
                    <label for="makeupDate">보강 일정 (선택)</label>
                    <button class="btn-sm" onclick="copyMakeupText()">📋 복사</button>
                </div>
                <div class="date-time-flex">
                    <input type="date" id="makeupDate" onchange="saveCurrentInput();">
                    <input type="text" id="makeupTime" placeholder="예: 5시" oninput="saveCurrentInput();">
                </div>
            </div>

            <!-- 7. 개별 학생 문구 -->
            <div class="form-group">
                <div class="label-header">
                    <label for="memoInput">✏️ 학생 개별 문구 (당일 특이사항)</label>
                    <button class="btn-sm" onclick="copyInputValue('memoInput', '학생 개별 문구')">📋 복사</button>
                </div>
                <textarea id="memoInput" rows="3" placeholder="예: 오늘 수업 태도가 매우 좋았습니다." oninput="updateNoticeFromManualInput(); saveCurrentInput();"></textarea>
            </div>
        </div>

        <!-- 결과 및 직접 수정 영역 -->
        <div class="card">
            <h3 style="margin-bottom: 12px; font-size: 1rem; color: #333;">📋 아카2000 입력 항목 (수정 가능)</h3>

            <!-- 교재 & 진도 (수정 가능) -->
            <div class="copy-box-group">
                <div class="copy-box-header">
                    <label for="outProgress">📖 교재 & 진도 (선택 후 직접 수정 가능)</label>
                    <button class="btn-sm" onclick="copyInputValue('outProgress', '교재 및 진도')">📋 진도 복사</button>
                </div>
                <input type="text" id="outProgress" oninput="updateNoticeFromManualInput(); saveCurrentInput();" placeholder="진도를 선택하거나 직접 입력하세요">
            </div>

            <!-- 오늘 과제 (수정 가능) -->
            <div class="copy-box-group">
                <div class="copy-box-header">
                    <label for="outHomework">✏️ 오늘 과제 (선택 후 직접 수정 가능)</label>
                    <button class="btn-sm" onclick="copyInputValue('outHomework', '오늘 과제')">📋 과제 복사</button>
                </div>
                <input type="text" id="outHomework" oninput="updateNoticeFromManualInput(); saveCurrentInput();" placeholder="과제를 선택하거나 직접 입력하세요">
            </div>

            <!-- 공통 알림장 (자동 연동 및 직접 수정 가능) -->
            <div class="copy-box-group">
                <div class="copy-box-header">
                    <label for="outCommonNotice">📢 공통 알림장 (자동 불러오기 및 수정 가능)</label>
                    <button class="btn-sm" onclick="copyInputValue('outCommonNotice', '공통 알림장')">📋 공통알림장 복사</button>
                </div>
                <textarea id="outCommonNotice" rows="3" oninput="updateNoticeFromManualInput(); saveCurrentInput();" placeholder="진도 선택 시 시트의 공통알림장이 자동 반영됩니다."></textarea>
            </div>

            <hr style="margin: 12px 0; border: none; border-top: 1px dashed #ddd;">

            <!-- 공유 전송용 알림장 -->
            <div class="form-group">
                <label for="result">📱 카톡 / 문자 공유 전송용 알림장</label>
                <textarea id="result" readonly placeholder="학생 및 진도를 선택하거나 수정하면 알림장이 자동 생성됩니다."></textarea>
            </div>

            <div class="btn-group">
                <button class="btn-main btn-primary" onclick="copyNotice()">📋 알림장 복사</button>
                <button class="btn-main btn-share" onclick="shareNotice()">📲 카톡 공유</button>
                <button class="btn-main btn-save-sheet" onclick="uploadToGoogleSheet()">☁️ 구글 시트에 누적 저장</button>
            </div>
        </div>
    </div>

    <div id="toast" class="toast">안내 메시지</div>

    <script>
        const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbypEPpo_ah7GwsKXHm7K8gnrWkhHtJcSyafLysb2_-5B5Wq9tf1rdc8NQXmG22YvOUg/exec";

        let students = [];
        let curriculum = {};
        let activeFocusIndex = -1;

        window.onload = function() {
            fetchSheetData();
            // 화면 다른 곳 클릭 시 자동완성 드롭다운 닫기
            document.addEventListener("click", function(e) {
                if (!e.target.closest(".form-group")) {
                    hideStudentResults();
                }
            });
        };

        function fetchSheetData() {
            const loading = document.getElementById("loadingText");
            loading.style.display = "block";
            loading.textContent = "구글 시트에서 데이터를 불러오는 중...";

            fetch(GOOGLE_SCRIPT_URL, {
                method: "GET",
                redirect: "follow"
            })
            .then(res => res.json())
            .then(data => {
                if (data.error) throw new Error(data.error);
                students = data.students || [];
                curriculum = data.curriculum || {};

                refreshBookSelect();

                loading.textContent = `✅ 로드 완료! (학생 ${students.length}명 / 교재 ${Object.keys(curriculum).length}개)`;
                setTimeout(() => { loading.style.display = "none"; }, 2000);
            })
            .catch(err => {
                console.error(err);
                loading.textContent = "❌ 연동 실패. 앱스 스크립트 배포 URL과 '모든 사용자' 권한 설정을 확인하세요.";
            });
        }

        /* --- 실시간 학생 검색 및 자동완성 목록 처리 --- */
        function onStudentSearchInput() {
            const query = document.getElementById("studentInput").value.toLowerCase().trim();
            const resultsBox = document.getElementById("studentResults");
            resultsBox.innerHTML = "";
            activeFocusIndex = -1;

            if (students.length === 0) return;

            const filtered = students.filter(s => {
                const name = (s.이름 || '').toLowerCase();
                const school = (s.학교학년 || '').toLowerCase();
                return name.includes(query) || school.includes(query);
            });

            if (filtered.length === 0) {
                resultsBox.style.display = "none";
                return;
            }

            filtered.forEach((s, index) => {
                const item = document.createElement("div");
                item.className = "autocomplete-item";
                const schoolInfo = s.학교학년 ? `<span class="school-tag">${s.학교학년}</span>` : '';
                item.innerHTML = `<span>${s.이름}</span> ${schoolInfo}`;
                
                item.onclick = function() {
                    selectStudent(s);
                };
                resultsBox.appendChild(item);
            });

            resultsBox.style.display = "block";
        }

        function hideStudentResults() {
            document.getElementById("studentResults").style.display = "none";
        }

        function handleStudentKeyDown(e) {
            const resultsBox = document.getElementById("studentResults");
            const items = resultsBox.getElementsByClassName("autocomplete-item");

            if (resultsBox.style.display === "none" || items.length === 0) return;

            if (e.key === "ArrowDown") {
                activeFocusIndex++;
                if (activeFocusIndex >= items.length) activeFocusIndex = 0;
                updateActiveItem(items);
                e.preventDefault();
            } else if (e.key === "ArrowUp") {
                activeFocusIndex--;
                if (activeFocusIndex < 0) activeFocusIndex = items.length - 1;
                updateActiveItem(items);
                e.preventDefault();
            } else if (e.key === "Enter") {
                e.preventDefault();
                if (activeFocusIndex > -1 && items[activeFocusIndex]) {
                    items[activeFocusIndex].click();
                } else if (items.length > 0) {
                    items[0].click(); // 엔터 입력 시 첫 번째 학생 자동 선택
                }
            }
        }

        function updateActiveItem(items) {
            for (let i = 0; i < items.length; i++) {
                items[i].classList.remove("active");
            }
            if (activeFocusIndex > -1) {
                items[activeFocusIndex].classList.add("active");
                items[activeFocusIndex].scrollIntoView({ block: "nearest" });
            }
        }

        function selectStudent(student) {
            document.getElementById("studentInput").value = student.이름;
            document.getElementById("selectedStudentId").value = student.id;
            hideStudentResults();

            updateStudentInfo(student);

            // 해당 학생의 이전 작성 내역 불러오기
            const savedData = localStorage.getItem("last_input_" + student.id);
            if (savedData) {
                const parsed = JSON.parse(savedData);
                document.getElementById("bookSelect").value = parsed.bookName || "";
                updateLessonOptions();
                document.getElementById("lessonSelect").value = parsed.lessonIdx !== undefined ? parsed.lessonIdx : "";
                document.getElementById("scoreInput").value = parsed.score || "";
                document.getElementById("absentDate").value = parsed.absentDate || "";
                document.getElementById("makeupDate").value = parsed.makeupDate || "";
                document.getElementById("makeupTime").value = parsed.makeupTime || "";
                document.getElementById("memoInput").value = parsed.memo || "";
                document.getElementById("outProgress").value = parsed.manualProgress || "";
                document.getElementById("outHomework").value = parsed.manualHomework || "";
                document.getElementById("outCommonNotice").value = parsed.commonNotice || "";
                showToast(`${student.이름} 학생의 이전 작성 내역을 불러왔습니다.`);
            } else {
                resetFormFieldsExceptStudent();
            }

            updateNoticeFromManualInput();
        }

        function updateStudentInfo(student) {
            const infoBox = document.getElementById("studentInfoBox");
            if (!student) {
                infoBox.style.display = "none";
                return;
            }

            infoBox.innerHTML = `
                📌 <b>학교/학년:</b> ${student.학교학년 || '-'}<br>
                📚 <b>교과서:</b> ${student.교과서 || '-'} | <b>시험날짜:</b> ${student.시험날짜 || '-'}<br>
                🎯 <b>시험범위:</b> ${student.시험범위 || '-'}
            `;
            infoBox.style.display = "block";
        }

        function refreshBookSelect() {
            const select = document.getElementById("bookSelect");
            select.innerHTML = '<option value="">-- 교재를 선택하세요 --</option>';
            Object.keys(curriculum).forEach(book => {
                const opt = document.createElement("option");
                opt.value = book;
                opt.textContent = book;
                select.appendChild(opt);
            });
        }

        function updateLessonOptions() {
            const bookName = document.getElementById("bookSelect").value;
            const lessonSelect = document.getElementById("lessonSelect");
            lessonSelect.innerHTML = '<option value="">-- 진도를 선택하세요 --</option>';

            if (bookName && curriculum[bookName]) {
                curriculum[bookName].forEach((item, index) => {
                    const opt = document.createElement("option");
                    opt.value = index;
                    opt.textContent = item.lesson;
                    lessonSelect.appendChild(opt);
                });
            }
        }

        function onLessonChange() {
            const bookName = document.getElementById("bookSelect").value;
            const lessonIdx = document.getElementById("lessonSelect").value;
            const studentName = document.getElementById("studentInput").value || "학생";

            if (bookName && lessonIdx !== "" && curriculum[bookName] && curriculum[bookName][lessonIdx]) {
                const lessonObj = curriculum[bookName][lessonIdx];

                document.getElementById("outProgress").value = `${bookName} [${lessonObj.lesson}]`;
                document.getElementById("outHomework").value = lessonObj.homework || "없음";

                // 공통 알림장 치환 (%학생% -> 학생 이름 적용)
                let rawNotice = lessonObj.commonNotice || "";
                let formattedNotice = rawNotice.replace(/%학생%/g, studentName);
                document.getElementById("outCommonNotice").value = formattedNotice;
            }
            updateNoticeFromManualInput();
        }

        function updateNoticeFromManualInput() {
            const studentId = document.getElementById("selectedStudentId").value;
            const studentName = document.getElementById("studentInput").value;
            if (!studentId && !studentName) {
                document.getElementById("result").value = "";
                return;
            }

            const student = students.find(s => s.id == studentId);
            const progressText = document.getElementById("outProgress").value || "";
            const homeworkText = document.getElementById("outHomework").value || "";
            const commonNoticeText = document.getElementById("outCommonNotice").value || "";
            const memoText = document.getElementById("memoInput").value || "";
            const schoolGrade = student ? (student.학교학년 || "") : "";

            let shareText = `[학원 알림장]\n`;
            shareText += `👤 학생명: ${studentName}${schoolGrade ? ` (${schoolGrade})` : ''}\n`;
            shareText += `📖 오늘 진도: ${progressText}\n`;
            shareText += `✏️ 오늘 과제: ${homeworkText}`;

            if (commonNoticeText) {
                shareText += `\n\n📢 오늘 수업 소식:\n${commonNoticeText}`;
            }

            if (memoText) {
                shareText += `\n\n💬 선생님 전달사항:\n${memoText}`;
            }

            document.getElementById("result").value = shareText;
        }

        function saveCurrentInput() {
            const studentId = document.getElementById("selectedStudentId").value;
            if (!studentId) return;

            const inputData = {
                bookName: document.getElementById("bookSelect").value,
                lessonIdx: document.getElementById("lessonSelect").value,
                manualProgress: document.getElementById("outProgress").value,
                manualHomework: document.getElementById("outHomework").value,
                commonNotice: document.getElementById("outCommonNotice").value,
                score: document.getElementById("scoreInput").value,
                absentDate: document.getElementById("absentDate").value,
                makeupDate: document.getElementById("makeupDate").value,
                makeupTime: document.getElementById("makeupTime").value,
                memo: document.getElementById("memoInput").value
            };

            localStorage.setItem("last_input_" + studentId, JSON.stringify(inputData));
        }

        function uploadToGoogleSheet() {
            const studentId = document.getElementById("selectedStudentId").value;
            const studentName = document.getElementById("studentInput").value;
            if (!studentId && !studentName) return alert("저장할 학생을 먼저 입력/선택해 주세요.");

            const payload = {
                studentName: studentName,
                progress: document.getElementById("outProgress").value,
                homework: document.getElementById("outHomework").value,
                score: document.getElementById("scoreInput").value,
                absentDate: document.getElementById("absentDate").value,
                makeupDate: document.getElementById("makeupDate").value,
                makeupTime: document.getElementById("makeupTime").value,
                memo: document.getElementById("memoInput").value
            };

            showToast("구글 시트에 기록 전송 중...");

            const formData = new URLSearchParams();
            Object.keys(payload).forEach(key => formData.append(key, payload[key]));

            fetch(GOOGLE_SCRIPT_URL, {
                method: "POST",
                mode: "no-cors",
                headers: { "Content-Type": "application/x-www-form-urlencoded" },
                body: formData.toString()
            })
            .then(() => {
                showToast("☁️ 구글 시트 '수업기록' 탭에 추가 업로드되었습니다!");
            })
            .catch(err => {
                console.error(err);
                alert("저장 실패: 앱스 스크립트 배포 설정 및 URL을 확인하세요.");
            });
        }

        function resetFormFieldsExceptStudent() {
            document.getElementById("bookSelect").value = "";
            document.getElementById("lessonSelect").innerHTML = '<option value="">-- 진도를 선택하세요 --</option>';
            document.getElementById("scoreInput").value = "";
            document.getElementById("absentDate").value = "";
            document.getElementById("makeupDate").value = "";
            document.getElementById("makeupTime").value = "";
            document.getElementById("memoInput").value = "";
            document.getElementById("outProgress").value = "";
            document.getElementById("outHomework").value = "";
            document.getElementById("outCommonNotice").value = "";
            document.getElementById("result").value = "";
        }

        function resetForm() {
            const studentId = document.getElementById("selectedStudentId").value;
            if (studentId) {
                localStorage.removeItem("last_input_" + studentId);
            }
            document.getElementById("studentInput").value = "";
            document.getElementById("selectedStudentId").value = "";
            document.getElementById("studentInfoBox").style.display = "none";
            resetFormFieldsExceptStudent();
            showToast("입력창이 초기화되었습니다.");
        }

        function copySelectedStudentName() {
            const val = document.getElementById("studentInput").value;
            if (!val) return alert("학생 이름을 먼저 입력해 주세요.");
            navigator.clipboard.writeText(val).then(() => showToast("학생 이름 복사 완료!"));
        }

        function copyInputValue(elementId, labelName) {
            const val = document.getElementById(elementId).value;
            if (!val) return alert(`${labelName} 내용을 먼저 입력해 주세요.`);
            navigator.clipboard.writeText(val).then(() => showToast(`${labelName} 복사 완료!`));
        }

        function copyMakeupText() {
            const date = document.getElementById("makeupDate").value;
            const time = document.getElementById("makeupTime").value;
            if (!date) return alert("보강 날짜를 먼저 선택해 주세요.");
            const fullText = `${date}${time ? ' ' + time : ''}`;
            navigator.clipboard.writeText(fullText).then(() => showToast("보강 일정 복사 완료!"));
        }

        function copySelectText(elementId, labelName) {
            const select = document.getElementById(elementId);
            if (!select.value) return alert(`${labelName} 항목을 선택해 주세요.`);
            let selectedText = select.options[select.selectedIndex].text;
            navigator.clipboard.writeText(selectedText).then(() => showToast(`${labelName} 복사 완료!`));
        }

        function copyNotice() {
            const resultText = document.getElementById("result").value;
            if (!resultText) return alert("생성된 알림장 내용이 없습니다.");
            navigator.clipboard.writeText(resultText).then(() => showToast("알림장 문구가 복사되었습니다!"));
        }

        function shareNotice() {
            const resultText = document.getElementById("result").value;
            if (!resultText) return alert("생성된 알림장 내용이 없습니다.");

            if (navigator.share) {
                navigator.share({ title: '학원 알림장', text: resultText }).catch(() => {});
            } else {
                copyNotice();
                alert("알림장 문구가 복사되었습니다. 카카오톡에 붙여넣으세요.");
            }
        }

        function showToast(msg) {
            const toast = document.getElementById("toast");
            toast.textContent = msg;
            toast.style.display = "block";
            setTimeout(() => { toast.style.display = "none"; }, 2500);
        }
    </script>
</body>
</html>
